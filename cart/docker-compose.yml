version: "3"

services:
  soft-arq-cart:
    build: .
    container_name: arq-soft-cart
    ports:
      - "8000:8000"
    networks:
      - default
      - puc-arq-soft
    environment:
      - PORT=8000
      - SECRET=SECRET
      - PRODUCT_API_URL=https://fakestoreapi.com/
      - DB_NAME=cart
      - ENV=$ENV
      - OTEL_SERVICE_NAME=puc-arq-soft-cart
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - "./src:/app/src"
      - "./db:/app/db"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: requirements.txt

networks:
  puc-arq-soft:
    external: true
    name: puc-arq-soft-net

